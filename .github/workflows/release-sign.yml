# Compiles the Dornick install wizard in CI and (if SignPath is configured)
# signs it; attaches the result to the GitHub release as an asset.
#
# WHY: Smart App Control (SAC) / SmartScreen blocks an unsigned exe.
# Two files must be signed: (1) `dornick.exe` inside the package (a pythonw
# copy — the app's running process; the one SAC actually blocks), (2) the
# final install wizard `dornick-setup-<version>.exe`.
#
# ────────────────────────────────────────────────────────────────────────
# SETUP (AFTER SignPath approval arrives — repo Settings → Secrets/Variables):
#
#   Secret:
#     SIGNPATH_API_TOKEN         SignPath user API token
#   Variables (Settings → Variables → Actions):
#     SIGNPATH_ORGANIZATION_ID   SignPath organization GUID
#     SIGNPATH_PROJECT_SLUG      e.g. "dornick"
#     SIGNPATH_POLICY_SLUG       e.g. "release-signing" ("test-signing" for testing)
#     SIGNPATH_EXE_CONFIG        artifact configuration slug for the inner exe (e.g. "exe")
#     SIGNPATH_INSTALLER_CONFIG  artifact configuration slug for the installer (e.g. "installer")
#
# On the SignPath side define two "artifact configurations": one signs a
# single `dornick.exe`, one signs a single `dornick-setup-*.exe`.
#
# WITHOUT the secret: the workflow still compiles and uploads the UNSIGNED
# installer as a workflow artifact (the signing steps are skipped) — useful
# before the approval too.
# ────────────────────────────────────────────────────────────────────────

name: Build & sign installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to upload assets to the release

jobs:
  build-sign:
    runs-on: windows-latest
    env:
      # Signing is on if the secret exists. (secrets cannot be used directly
      # inside `if`; we put it into env and check that.)
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Read version from pyproject.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $m) { throw "no version in pyproject.toml" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # Prepare the package but do not invoke iscc: we need to step in to sign
      # the inner dornick.exe. This step also does the pythonw → dornick.exe
      # copy and the ico stamp (build.ps1 -SkipCompile, launcher section).
      - name: Prepare package (no installer yet)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -SkipCompile

      # ── inner exe signing ─────────────────────────────────────────────
      - name: Upload inner exe for signing
        if: env.SIGN == 'true'
        id: up_exe
        uses: actions/upload-artifact@v4
        with:
          name: dornick-exe-unsigned
          path: installer/dist/paket/python/dornick.exe
          if-no-files-found: error

      - name: Sign inner dornick.exe (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG }}
          github-artifact-id: ${{ steps.up_exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Put signed exe back into the package
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-exe\dornick.exe installer\dist\paket\python\dornick.exe -Force

      # ── installer compile ─────────────────────────────────────────────
      - name: Compile installer (iscc)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" installer\dornick.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      # ── installer signing ─────────────────────────────────────────────
      - name: Upload installer for signing
        if: env.SIGN == 'true'
        id: up_setup
        uses: actions/upload-artifact@v4
        with:
          name: dornick-setup-unsigned
          path: installer/dist/dornick-setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG }}
          github-artifact-id: ${{ steps.up_setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Put signed installer back
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item "signed-setup\dornick-setup-${{ steps.ver.outputs.version }}.exe" "installer\dist\dornick-setup-${{ steps.ver.outputs.version }}.exe" -Force

      # ── output: workflow artifact in any case; attach as asset on release ──
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dornick-setup-${{ steps.ver.outputs.version }}
          path: installer/dist/dornick-setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      # Upload to the release ONLY when signed.
      #
      # A CI build running without signing configured could `--clobber` over
      # the full, hand-built package that was manually attached to the
      # release: since the external training rig is absent in CI, the
      # installer it produces is NARROWER in components. The unsigned output
      # still sits as a workflow artifact (the step above) — downloadable,
      # but it does not replace the file on the release.
      - name: Attach installer to the GitHub release (signed builds only)
        if: github.event_name == 'release' && env.SIGN == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "installer\dist\dornick-setup-${{ steps.ver.outputs.version }}.exe" --clobber
