name: memory

# Roadmap §9: unit tests on every PR, the life-benchmark holdout on every PR
# (well under ten minutes), and the long arms (threshold curve, growth set)
# only when main moves. The bench table lands in the job summary so a
# reviewer sees the three columns — old tag, previous phase, this PR —
# without downloading artefacts.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "eval/context_memory/**"
      - ".github/workflows/hafiza.yml"
  push:
    branches: [main]

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest pytest-cov
      - name: Unit tests with coverage
        # Coverage gate from the roadmap: new memory modules ≥ 90 % lines.
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --cov=dornick.recall --cov=dornick.mind
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

  holdout:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the old tag must be reachable for --old
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Old-version worktree
        shell: bash
        run: |
          git worktree add eval/eski hafiza-eski 2>/dev/null || true
      - name: Life benchmark, holdout set
        shell: bash
        run: |
          python eval/context_memory/life_bench.py --data holdout --label holdout-taban --old
          python eval/context_memory/life_bench.py --data holdout --label holdout
          {
            echo "## Life benchmark — holdout"
            cat docs/charts/yasam-holdout.md
          } >> "$GITHUB_STEP_SUMMARY"

  long-arms:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Threshold curve and growth set
        shell: bash
        run: |
          python eval/context_memory/life_bench.py --threshold-curve --label esik-egrisi
          python eval/context_memory/life_bench.py --growth --label buyume
          {
            echo "## Threshold curve"
            cat docs/charts/basinc-bozulma.md
            echo "## Growth"
            cat docs/charts/yasam-buyume.md
          } >> "$GITHUB_STEP_SUMMARY"
